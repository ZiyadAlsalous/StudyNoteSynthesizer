services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    command: python -m studysynth ui
    environment:
      # Payload indexes only take effect against a real server, which is why
      # chapter scoping is developed against this container and not :memory:.
      STUDYSYNTH_QDRANT__BACKEND: server
      STUDYSYNTH_QDRANT__URL: http://qdrant:6333
      STUDYSYNTH_LLM__BACKEND: claude
      STUDYSYNTH_EMBEDDINGS__BACKEND: qwen
      STUDYSYNTH_EMBEDDINGS__MODEL: Qwen/Qwen3-Embedding-0.6B
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      # Persisted across restarts: SQLite catalogue, checkpoints, OCR cache,
      # generated documents.
      - ./data:/app/data
      # Your textbook, slides and note photos.
      # The embedding model, so the container does not re-download it.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  hf_cache:
