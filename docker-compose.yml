services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    command: python -m studysynth serve
    environment:
      # Payload indexes only take effect against a real server, which is why
      # chapter scoping is developed against this container and not :memory:.
      STUDYSYNTH_QDRANT__BACKEND: server
      STUDYSYNTH_QDRANT__URL: http://qdrant:6333
      STUDYSYNTH_SERVER__HOST: 0.0.0.0
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./fixtures:/app/fixtures
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
