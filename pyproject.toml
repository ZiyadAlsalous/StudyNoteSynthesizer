[project]
name = "studysynth"
version = "0.1.0"
description = "Turns handwritten lecture notes into an exam-ready study document per chapter."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pypdf>=4.2",
    "python-pptx>=0.6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "langchain-core>=0.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
claude = ["anthropic>=0.30"]
qwen = ["sentence-transformers>=3.0"]
render = ["weasyprint>=62"]
dev = ["pytest>=8.2", "mypy>=1.10", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["studysynth"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "pypdf.*", "pptx.*", "langgraph.*", "sentence_transformers.*",
          "anthropic.*", "weasyprint.*", "markdown_it.*", "uvicorn.*"]
ignore_missing_imports = true
