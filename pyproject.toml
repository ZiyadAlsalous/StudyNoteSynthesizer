[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studysynth"
version = "0.1.0"
description = "Completes handwritten lecture notes against the professor's slides, with the textbook admitted only where they leave a gap."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pypdf>=4.2",
    "python-pptx>=0.6",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "langchain-core>=0.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
claude = ["anthropic>=0.30"]
qwen = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studysynth = ["prompts/*.md", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/studysynth"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "pypdf.*", "pptx.*", "pymupdf.*", "langgraph.*",
          "sentence_transformers.*", "anthropic.*", "markdown_it.*", "streamlit.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RET", "PTH"]
